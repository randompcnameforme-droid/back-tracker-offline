<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Back Tracker Offline</title>
<meta name="theme-color" content="#0E6A6D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* One narrow thumb-first column. Sticky header with save status, optional workout/timer bar under it,
   five-tab bar fixed to the bottom. Teal accent on a cool blue-grey neutral; semantic ok/warn/stop separate. */
:root{
  --c-home:#2F6FB5; --c-gym:#AC4A0A; --c-office:#7A4FB0; --c-ink:#FFFFFF;  --bg:#F2F5F6; --surface:#FFFFFF; --surface2:#E7EDEF; --ink:#13212B; --ink2:#4B5D69; --line:#D3DCE1;
  --accent:#0E6A6D; --accent-ink:#FFFFFF; --accent-soft:#D6ECED;
  --ok:#1B7A49; --ok-soft:#D9F0E3; --ok-solid:#1B7A49; --on-ok:#FFFFFF;
  --warn:#8F5200; --warn-soft:#FBE8C6;
  --stop:#B3261E; --stop-soft:#F8DAD7; --stop-solid:#B3261E; --on-stop:#FFFFFF;
  --c-right:#0E6A6D; --c-left:#B0562A; --c-rest:#E3E9EC; --c-trans:#F3E3C7; --c-stretch:#6E5BA8;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --r:14px;
  /* type scale (v3): size / weight / family in one shorthand each */
  --t-hero:700 40px/1.05 var(--font-head);
  --t-title:700 22px/1.15 var(--font-head);
  --t-section:600 18px/1.25 var(--font-head);
  --t-body:400 16px/1.45 var(--font-body);
  --t-meta:400 14px/1.4 var(--font-body);
  --t-label:600 12px/1.2 var(--font-head);
  --t-label-ls:.07em;
  --bar-h:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1519; --surface:#162027; --surface2:#1F2C34; --ink:#E6EEF2; --ink2:#9DB0BB; --line:#2B3B45;
    --accent:#4DB8BC; --accent-ink:#06201F; --accent-soft:#12383A;
    --ok:#5CC98B; --ok-soft:#10301F; --ok-solid:#4CC38A; --on-ok:#06210F;
    --warn:#F0B04A; --warn-soft:#3A2B0E;
    --stop:#FF8A80; --stop-soft:#3B1715; --stop-solid:#FF8A80; --on-stop:#3A0A07;
    --c-home:#7DB2EA; --c-gym:#F0955A; --c-office:#BE9CEB; --c-ink:#10151A; --c-right:#4DB8BC; --c-left:#E8935F; --c-rest:#24323A; --c-trans:#3A3220; --c-stretch:#A493DE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#162027; --surface2:#1F2C34; --ink:#E6EEF2; --ink2:#9DB0BB; --line:#2B3B45;
  --accent:#4DB8BC; --accent-ink:#06201F; --accent-soft:#12383A;
  --ok:#5CC98B; --ok-soft:#10301F; --ok-solid:#4CC38A; --on-ok:#06210F;
  --warn:#F0B04A; --warn-soft:#3A2B0E;
  --stop:#FF8A80; --stop-soft:#3B1715; --stop-solid:#FF8A80; --on-stop:#3A0A07;
  --c-home:#7DB2EA; --c-gym:#F0955A; --c-office:#BE9CEB; --c-ink:#10151A; --c-right:#4DB8BC; --c-left:#E8935F; --c-rest:#24323A; --c-trans:#3A3220; --c-stretch:#A493DE;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:var(--t-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);max-width:620px;margin:0 auto}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-block:6px;margin-inline:-8px}
.bar-main{display:flex;align-items:center;min-width:0;flex:1}
.bar-title{position:relative;flex:1;min-width:0;min-height:44px;display:grid;align-content:center;padding-inline:6px}
.bar-title.mid{text-align:center}
.bar-right{display:flex;align-items:center;flex:none;min-width:0}
.hbtn{flex:none;width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink);padding:0}
.hbtn.flag{color:var(--stop)}
.hbtn[disabled]{opacity:.35}
.savebtn{flex:none;min-width:44px;min-height:44px;border:0;background:none;padding:0 2px;display:inline-flex;align-items:center;justify-content:center;max-width:44vw}
.dpick{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;font-size:16px;background:none;cursor:pointer}
.barchip{padding:0 0 2px}
.hit{min-height:44px;min-width:44px;border:0;background:none;padding:0;display:inline-flex;align-items:center}
.eyebrow{font:var(--t-label);letter-spacing:var(--t-label-ls);text-transform:uppercase;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{font:var(--t-title);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;background:var(--ok-soft);color:var(--ok);white-space:nowrap;border:0;max-width:100%;min-width:0}
#saveTxt{overflow:hidden;text-overflow:ellipsis}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.stop{background:var(--stop-soft);color:var(--stop)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.wchip{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:6px 10px;background:var(--accent-soft);color:var(--accent);font:600 15px/1.2 var(--font-head);font-variant-numeric:tabular-nums}
.wchip.timer{background:var(--ok-soft);color:var(--ok)}
.wchip.over{background:var(--warn-soft);color:var(--warn)}
.wchip.rest{background:var(--surface2);color:var(--ink2)}
.wrap{max-width:620px;margin:0 auto;padding-block:14px calc(110px + var(--dock-h,0px) + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.stack{display:grid;gap:16px;min-width:0}
.stack.tight{gap:8px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
.banner.stop{background:var(--stop-soft);color:var(--stop)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner b{font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.lbl{font:var(--t-label);letter-spacing:var(--t-label-ls);text-transform:uppercase;color:var(--ink2);margin:0 0 10px}
.lbl.pad{margin:0}
.hint{margin:0 0 10px;color:var(--ink2);font:var(--t-meta)}
.row-flex{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--ink2)}
.small{font-size:13px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{height:58px;border:0;background:none;display:grid;place-items:center;gap:2px;padding:6px 0;color:var(--ink2);font-size:11.5px;font-weight:600}
.tab svg{width:22px;height:22px}
.ti{position:relative;display:grid;place-items:center}
.wdot{position:absolute;top:-2px;right:-5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.tab[aria-current="page"]{color:var(--accent)}
.tab[hidden]{display:none!important}
/* SLS */
.sls-row{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:8px;align-items:center;margin-bottom:8px}
.sls-row span{font-weight:600;font-size:15px}
.num{width:100%;height:54px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:center;font:600 24px/1 var(--font-head);font-variant-numeric:tabular-nums}
.num:focus{border-color:var(--accent);outline:none}
.floor{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.floor .big{font:var(--t-hero);line-height:1;font-variant-numeric:tabular-nums}
.floor .sub{font-size:13px;color:var(--ink2)}
.collapsed-line{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left}
/* chips */
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.stop{background:var(--stop-soft);color:var(--stop)}
.chip.neutral{background:var(--surface2);color:var(--ink2)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.big{font-size:14px;padding:5px 12px}
/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg-btn{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font:600 18px/1 var(--font-head)}
.seg-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sess-chips{display:flex;flex-wrap:wrap;gap:8px}
.sess-chip{min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.sess-chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rchips{display:flex;gap:0;flex-wrap:wrap}
.rchip{min-height:44px;min-width:44px;padding:0 3px;border:0;background:none}
.rchip>span{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.rchip.on>span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* checklist */
.block-head{min-height:44px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;width:100%;border:0;background:none;padding:0 2px;text-align:left}
.block-head h3{margin:0;font:var(--t-label);letter-spacing:var(--t-label-ls);text-transform:uppercase;color:var(--ink2)}
.bnote{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.count{font:600 14px/1 var(--font-head);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.count.all{color:var(--ok)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list.inner{border-radius:12px;margin-top:4px}
.row+.row{border-top:1px solid var(--line)}
.row-main{display:flex;gap:10px;align-items:center;padding:8px 10px 8px 8px}
.tick{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;font:700 12px var(--font-head)}
.tick[data-s="done"]{background:var(--ok-solid);border-color:var(--ok-solid);color:var(--on-ok)}
.row-text{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;background:none;border:0;padding:6px 0;min-height:46px}
.row-copy{flex:1;min-width:0;display:grid;gap:2px}
.nm{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ds{font:var(--t-meta);color:var(--ink2)}
.chev{flex:none;color:var(--ink2);transition:transform .15s}
.row-text[aria-expanded="true"] .chev{transform:rotate(90deg)}
.panel{padding:2px 12px 14px;display:grid;gap:10px}
.info{margin:0;font-size:15px}
.info.small{font-size:13px;color:var(--ink2)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
textarea,.txt{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px}
textarea{min-height:64px;resize:vertical}
.txt{height:46px}
select.txt{padding:8px 10px}
.field{display:grid;gap:4px;min-width:0}
.fl{font:var(--t-label);letter-spacing:var(--t-label-ls);text-transform:uppercase;color:var(--ink2)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:44px;height:44px;margin:0;background:none;border:0;cursor:pointer}
input[type=checkbox]::before{content:"";position:absolute;inset:10px;border:2px solid var(--ink2);border-radius:6px;background:var(--bg)}
input[type=checkbox]:checked::before{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:18px;top:12px;width:7px;height:14px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg)}
input[type=checkbox]:focus-visible{outline:none}
input[type=checkbox]:focus-visible::before{outline:2px solid var(--accent);outline-offset:2px}
.eod{display:grid;gap:12px}
/* entry */
.entry{display:grid;gap:10px}
.side-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side-tab{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.side-tab.on.R{background:var(--c-right);border-color:var(--c-right);color:var(--surface)}
.side-tab.on.L{background:var(--c-left);border-color:var(--c-left);color:var(--surface)}
.setrow{border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:8px;background:var(--bg)}
.setrow.done{border-color:var(--ok-solid)}
.setrow.live{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.set-top{display:flex;align-items:center;gap:8px}
.set-n{font:600 14px/1 var(--font-head);color:var(--ink2);flex:1}
.set-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.stepper button{height:44px;border:0;background:var(--surface2);font:600 20px/1 var(--font-head)}
.stepper input{width:100%;height:44px;border:0;background:transparent;text-align:center;font:600 18px/1 var(--font-head);font-variant-numeric:tabular-nums;min-width:0}
.stepper input:focus{outline:none;background:var(--accent-soft)}
.stepper input::placeholder{color:var(--ink2);opacity:.55}
.ibtn{flex:none;min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-weight:700;padding:0 8px;font-size:14px}
.ibtn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ibtn.stopb{background:var(--stop-solid);border-color:var(--stop-solid);color:var(--on-stop)}
.ibtn.okb{color:var(--ok);border-color:var(--ok)}
.btn{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:8px 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--accent)}
.btn.danger{color:var(--stop);border-color:var(--stop)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.suggest{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:12px;padding:8px 10px;background:var(--accent-soft);color:var(--accent);font-size:14px}
.suggest b{font-weight:700}
.variant{display:flex;gap:6px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-weight:600;text-decoration:none;border:0;background:none;padding:0}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 14px var(--font-head)}
.ex-title{flex:1;min-width:0}
.ex-title h3{margin:0;font:600 18px/1.25 var(--font-head)}
.ex-title .dose{margin:2px 0 0;color:var(--ink2);font-size:14px}
.linkish{display:inline-flex;align-items:center;min-height:44px;border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.next{border:2px solid var(--accent);background:var(--surface)}
.next h2{margin:2px 0 4px;font:700 20px/1.2 var(--font-head)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px/1.3 var(--font-head);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);background:var(--surface2)}
td.num-c,th.num-c{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
/* charts */
.chart-box{position:relative;height:230px}
.chart-box.short{height:150px}
.spark-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 64px;gap:10px;align-items:center;padding:8px 10px;border:0;background:none;width:100%;text-align:left}
.spark-row+.spark-row{border-top:1px solid var(--line)}
.spark-row svg{width:110px;height:32px}
.heat{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));gap:4px;font-size:11px;color:var(--ink2)}
.heat .cell{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font:600 11px var(--font-head);background:var(--surface2);color:var(--ink2);max-width:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tl-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tl-sum div{background:var(--surface2);border-radius:10px;padding:8px}
.tl-sum b{display:block;font:700 18px/1.1 var(--font-head);font-variant-numeric:tabular-nums}
.tl-sum span{font-size:12px;color:var(--ink2)}
.tl svg{width:100%;display:block}
/* goals */
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.stage{border-left:3px solid var(--line);padding:2px 0 2px 12px;display:grid;gap:6px}
.stage.met{border-color:var(--ok-solid)}
.stage.in-progress{border-color:var(--accent)}
.stage.blocked,.stage.gated{border-color:var(--stop-solid)}
.crit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.doc{line-height:1.55}
.doc h1{font:700 24px/1.2 var(--font-head);margin:0 0 8px}
.doc h2{font:700 19px/1.25 var(--font-head);margin:22px 0 8px}
.doc h3{font:600 16px/1.3 var(--font-head);margin:18px 0 6px}
.doc p,.doc li{max-width:68ch}
.doc .tbl-wrap{margin:8px 0}
.doc hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.ask-out{white-space:pre-wrap}
.kv{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;word-break:break-word}
.msg{padding:18px}
.msg h2{margin:0 0 6px;font:700 20px var(--font-head)}
.msg p{margin:0;color:var(--ink2)}

  var defs={},parts={},lib={},order=[];
  function reg(def,where){defs[def.id]=Object.assign({},def,{where:where});order.push(def.id);
    if(def.parts)def.parts.forEach(function(p){parts[p.key]=Object.assign({},p,{id:p.key,parent:def.id,where:where,cues:def.cues})});
  }
  Object.keys(prog.dayTypes).forEach(function(k){prog.dayTypes[k].blocks.forEach(function(b){b.items.forEach(function(i){reg(i,k)})})});
  prog.mobilityBlock.items.forEach(function(i){reg(i,"mobility")});
  Object.keys(prog.gymSessions).forEach(function(k){if(k[0]==="_")return;prog.gymSessions[k].exercises.forEach(function(i){reg(i,"gym:"+k)})});
  (prog.exerciseLibrary||[]).forEach(function(e){lib[e.id]={id:e.id,name:e.name,slots:e.slots}});
  // library carries measure info from the first slot that uses it
  Object.keys(defs).concat(Object.keys(parts)).forEach(function(k){
    var d=defs[k]||parts[k];if(!d.exerciseId||!lib[d.exerciseId])return;
    var L=lib[d.exerciseId];if(L.measure)return;

}

  resource_exhausted:"Too many saves at once. Waiting a little before the next one.",
  quota_exceeded:"The app's storage is full. Tell Claude in the project chat; nothing more can be saved until it's fixed.",
  invalid_argument:"This change was rejected as written, which is a bug in the app. Tap Copy diagnostic report and send it to Claude.",

function loadOutbox(){var o=lsGet("bp-outbox");SYNC.outbox=Array.isArray(o)?o.map(function(e){e.inflight=false;return e}):[]}
function persistOutbox(){lsSet("bp-outbox",SYNC.outbox)}
function pendingFor(path){var p={};SYNC.outbox.forEach(function(e){if(e.path===path)p=deepMerge(p,e.patch)});return p}
var DERIVED_RE=/^(history|daySummary|sessionHistory)\//;
function isDerived(e){return DERIVED_RE.test(e.path)}
/* Only real changes count as "waiting". Derived chart summaries can be rebuilt, so they never hold up a save or the pill. */
function pendingCount(){var n=0;SYNC.outbox.forEach(function(e){if(!isDerived(e))n++});return n}
/* Real changes always go first; derived summaries only when nothing else is waiting. */
function nextIdx(){for(var i=0;i<SYNC.outbox.length;i++){if(!isDerived(SYNC.outbox[i]))return i}return 0}

/* Queue a change. Patches for the same document made while nothing is in flight are merged. */
function enqueue(path,patch){
  patch=clone(patch);
  var last=null;
  for(var i=SYNC.outbox.length-1;i>=0;i--){if(SYNC.outbox[i].path===path){last=SYNC.outbox[i];break}}
  if(last&&!last.inflight)last.patch=deepMerge(last.patch,patch);
  else SYNC.outbox.push({id:uid(),path:path,patch:patch,createdAt:Date.now(),attempts:0});
  persistOutbox();updatePill();
  clearTimeout(SYNC.coalesceTimer);SYNC.coalesceTimer=setTimeout(function(){kick()},700);
}
function kick(){clearTimeout(SYNC.timer);SYNC.timer=null;SYNC.retryAt=null;drain()}
function skeletonFor(path){
  var seg=path.split("/");
  if(seg[0]==="days")return {date:seg[1],createdAt:new Date().toISOString(),items:{},entries:{},events:{},extras:{},variantBySlot:{},endOfDay:{}};
  if(seg[0]==="history"||seg[0]==="daySummary"||seg[0]==="sessionHistory")return {days:{}};
  return {};
}
async function writePatch(path,patch){
  var ref=S.db.doc(path);
  if(!SYNC.known[path]){
    var snap=await withTimeout(ref.get(),WRITE_TIMEOUT);SYNC.lastAnswer=Date.now();
    if(!snap.exists){
      await withTimeout(ref.set(deepMerge(skeletonFor(path),patch)),WRITE_TIMEOUT);
      SYNC.known[path]=1;return;
    }
    SYNC.known[path]=1;
  }
  try{await withTimeout(ref.update(patch),WRITE_TIMEOUT)}
  catch(e){if(e&&e.code==="invalid_argument")delete SYNC.known[path];throw e}
}
async function drain(){
  if(SYNC.draining)return;
  if(!S.db){updatePill();return}
  SYNC.draining=true;updatePill();
  while(SYNC.outbox.length){
    var e=SYNC.outbox[nextIdx()];e.inflight=true;
    try{
      await writePatch(e.path,e.patch);
      var at=SYNC.outbox.indexOf(e);if(at>=0)SYNC.outbox.splice(at,1);persistOutbox();
      SYNC.lastOk=Date.now();SYNC.lastAnswer=Date.now();SYNC.backoffIdx=0;SYNC.lastError=null;SYNC.blocked=false;
      applyLocally(e.path,e.patch);
    }catch(err){
      e.inflight=false;e.attempts=(e.attempts||0)+1;
      var code=(err&&err.code)||"unavailable";
      if(code==="invalid_argument"&&e.attempts<2)code="unavailable";
      logError(code,err&&err.message,e.path);
      if(BLOCKING[code]||(code==="invalid_argument"||code==="transform_error")){SYNC.blocked=true}
      else{
        var wait=(code==="resource_exhausted"?30:BACKOFF[Math.min(SYNC.backoffIdx,BACKOFF.length-1)]);
        SYNC.backoffIdx++;SYNC.retryAt=Date.now()+wait*1000;
        clearTimeout(SYNC.timer);SYNC.timer=setTimeout(kick,wait*1000);
      }
      persistOutbox();break;
    }

  SYNC.draining=false;updatePill();
  if(!SYNC.outbox.length)maybeWriteDiagnostics();
  if(S.tab==="more"&&S.sub==="sync")renderSoon();
}
function applyLocally(path,patch){
  var seg=path.split("/");
  if(seg[0]==="days"){S.remote[seg[1]]=deepMerge(S.remote[seg[1]]||skeletonFor(path),patch);S.recent[seg[1]]=S.remote[seg[1]]}
  else if(seg[0]==="history"){S.histories[seg[1]]=deepMerge(S.histories[seg[1]]||{days:{}},patch)}
  else if(path==="daySummary/all")S.daySummary=deepMerge(S.daySummary||{days:{}},patch);
  else if(path==="sessionHistory/all")S.sessionHistory=deepMerge(S.sessionHistory||{days:{}},patch);
  else if(seg[0]==="battery"){S.batteries[seg[1]]=deepMerge(S.batteries[seg[1]]||{},patch)}
  else if(path==="state/current")S.state=deepMerge(S.state||{},patch);

function logError(code,msg,path){

  SYNC.lastError=e;SYNC.errors.push(e);if(SYNC.errors.length>50)SYNC.errors.shift();lsSet("bp-errors",SYNC.errors);

async function maybeWriteDiagnostics(force){

function pillState(){

/* ================= DAY MODEL ================= */
/* A day can include more than one section (e.g. Home and Gym). dayType is the first; alsoTypes holds the rest as {type:true}. */
function hasType(d,t){return !!d&&(d.dayType===t||!!(d.alsoTypes&&d.alsoTypes[t]===true))}
function daySections(d){
  var out=[];if(!d.dayType||!S.programme)return out;
  out.push(d.dayType);
  DAY_TYPES.forEach(function(p){if(p[0]!==d.dayType&&hasType(d,p[0])&&S.programme.dayTypes[p[0]])out.push(p[0])});
  return out;
}
function typeLabel(t){var r=DAY_TYPES.filter(function(p){return p[0]===t})[0];return r?r[1]:t}
function emptyDay(date){return {date:date,dayType:null,alsoTypes:{},session:null,variantBySlot:{},shortVersion:false,officeDepleted:false,
  sls:{right:{},left:{},floor:null,scattered:false},items:{},entries:{},events:{},extras:{},endOfDay:{},dock:{}}}
function normSls(s){ // accept old array form
  s=s||{};var o={right:{},left:{},floor:s.floor==null?null:s.floor,scattered:!!s.scattered};
  ["right","left"].forEach(function(sd){var v=s[sd];
    if(Array.isArray(v))v.forEach(function(x,i){if(x!=null)o[sd]["a"+(i+1)]=x});
    else if(isObj(v))for(var k in v)if(v[k]!=null)o[sd][k]=v[k];});
  return o;
}
function normDay(d,date){
  var e=emptyDay(date);if(!d)return e;
  var o=Object.assign(e,clone(d));
  o.sls=normSls(d.sls);
  ["items","entries","events","extras","variantBySlot","endOfDay","alsoTypes","morning","dock"].forEach(function(k){if(!isObj(o[k]))o[k]={}});
  return o;
}
function dayView(date){
  var base=S.remote[date]||S.recent[date]||null;
  var d=normDay(base,date);
  var p=pendingFor("days/"+date);
  if(Object.keys(p).length){d=deepMerge(d,p);d.sls=normSls(d.sls)}
  return d;
}
function D(){return dayView(S.date)}
function slsVals(d){var r=[],l=[];for(var i=1;i<=3;i++){r.push(d.sls.right["a"+i]);l.push(d.sls.left["a"+i])}return {r:r,l:l}}
function slsCalc(d){
  var v=slsVals(d),all=v.r.concat(v.l).filter(function(x){return x!=null});
  var n=all.length,min=n?Math.min.apply(null,all):null;
  return {n:n,live:min,floor:n===6?min:null,scattered:all.some(function(x){return x<20})||(n===6&&min<32)};
}
/* --- entries --- */
function entryId(key,side,n){return key+"|"+(side||"-")+"|"+n}
function entriesFor(d,key){var out=[];for(var id in d.entries){var e=d.entries[id];if(e&&!e.deleted&&e.slot===key)out.push(Object.assign({id:id},e))}return out}
function entryHasValue(e){return ["kg","reps","holdS","distanceM","minutes","breaths"].some(function(f){return e[f]!=null})}
function getEntry(d,key,side,n){var e=d.entries[entryId(key,side,n)];return e&&!e.deleted?e:null}

/* --- session --- */
/* ================= SIDES (3.8) =================
   Exercises done on both sides can be logged "together" (one set covers both) or "separate" (left and right sets).
   Order of precedence: a choice made on the day > what that day's logged sets already use > the saved preference > default. */
var SIDE_DEFAULT_TOGETHER={"bird-dog":1,"dead-bug-modified":1};
function rawDayScan(fn){var r=S.remote[S.date];if(r)fn(r);SYNC.outbox.forEach(function(o){if(o.path==="days/"+S.date)fn(o.patch)})}
function sideModeOf(def){
  if(def.sided!=="both")return "separate";
  var dayPick=null,used=null;
  rawDayScan(function(x){
    if(x.sideMode&&x.sideMode[def.id])dayPick=x.sideMode[def.id];
    if(x.entries)for(var k in x.entries){if(k.indexOf(def.id+"|")===0){var e=x.entries[k];if(e&&!e.deleted&&entryHasValue(e))used=e.side?"separate":"together"}}
  });
  if(dayPick)return dayPick;if(used)return used;
  var m=S.state&&S.state.sideMode&&S.state.sideMode[def.exerciseId];if(m)return m;
  return SIDE_DEFAULT_TOGETHER[def.exerciseId]?"together":"separate";
}
function sidesOf(def){
  if(def.sided==="both"){if(sideModeOf(def)==="together")return [null];return def.sideOrder&&def.sideOrder.length?def.sideOrder:["R","L"]}
  if(def.sided==="R"||def.sided==="L")return [def.sided];return [null];
}
function plannedSets(def,side){
  var t=def.target||{},n;
  if(side==="R"&&t.setsR!=null)n=t.setsR;else if(side==="L"&&t.setsL!=null)n=t.setsL;else n=t.sets||t.setsR||1;
  if(side==="R"&&t.extraSetR)n+=t.extraSetR;
  if(def.measure==="minutes"||def.measure==="breaths"||def.measure==="count")n=1;
  return Math.max(1,n);
}
function setSideMode(def,mode){
  var p={sideMode:{}};p.sideMode[def.exerciseId]=mode;enqueue("state/current",p);applyLocally("state/current",p);
  var dp={sideMode:{}};dp.sideMode[def.id]=mode;patchDay(dp);render();

  var ta=h("textarea",{id:"upd-ta",placeholder:"Paste the update from the tracker here",style:"min-height:110px"}),out=h("div");
  var fi=h("input",{type:"file",id:"upd-file",accept:".json,application/json,text/plain",onChange:function(){readFileInput(fi,function(t){ta.value=t})}});
  var at=lsGet("bp-update-at");
  parts.push(h("section",{class:"card stack tight"},h("h2",{class:"lbl pad"},"Load an update from the tracker"),
    h("p",{class:"hint"},(at?"Last update: "+fmtDate(at.slice(0,10))+". ":"No update loaded yet. ")+"In the tracker: More › Offline app › Copy update. Then paste here. Do this when the programme changes or about once a week."),ta,
    h("label",{class:"field"},h("span",{class:"fl"},"Or choose a file"),fi),
    h("button",{type:"button",class:"btn primary",onClick:function(){var r=loadTrackerUpdate(parsePasted(ta.value));
      S.ui.updMsg=r.error?{err:true,t:r.error}:{t:"Update loaded. Today's list and suggestions now match the tracker."};if(!r.error)ta.value="";setTimeout(render,100)}},"Load update"),
    S.ui.updMsg?h("div",{class:"banner"+(S.ui.updMsg.err?" stop":" info")},S.ui.updMsg.t):null,out));
  parts.push(h("p",{class:"info small"},"Offline app version "+APP_VERSION+" · programme "+(S.programme&&S.programme.programmeVersion||"—")));
  return parts;
}

/* ================= BOOT ================= */
async function boot(){
  S.storageOk=storageWorks();
  S.deviceId=lsGet("bp-device-id");if(!S.deviceId){S.deviceId="dev-"+uid();lsSet("bp-device-id",S.deviceId)}
  SYNC.errors=lsGet("bp-errors")||[];
  loadOutbox();
  var cache=lsGet("bp-cache-v2");
  if(cache){S.programme=cache.programme||null;S.state=cache.state||null;S.roadmap=cache.roadmap||null;S.custom=cache.custom||{};if(cache.remote)S.remote=cache.remote;if(S.programme)buildIndex()}
  if(!S.programme){var old=lsGet("bp-programme-cache");if(old&&old.dayTypes){S.programme=old;buildIndex()}}
  var r0=parseHash();S.tab=r0.tab;S.sub=r0.sub;initHistory(r0);wireHeader();
  render();
  setTimeout(function(){if(!S.progConfirmed){if(S.programme)S.progStale=true;else S.progTimedOut=true;render()}},10000);
  window.addEventListener("popstate",onPop);
  window.addEventListener("online",function(){kick()});
  S.todayAtLoad=todayStr();DOCK.reopenCheck=true;wireDockSizes();
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){DOCK.reopenCheck=true;kick();checkRollover();if(workoutState(D()).running||activeTimer(D()))requestWake();if(!focusedInput())render()}else{flushDerived();persistOutbox();saveCache()}});
  window.addEventListener("pagehide",function(){flushDerived();persistOutbox();saveCache()});
  document.addEventListener("focusout",function(){setTimeout(function(){if(S.needsRender&&!focusedInput())render()},120)});
  var tickN=0;setInterval(function(){dockTick();++tickN;if(tickN%15===0)checkRollover();if(S.tab==="library"&&S.sub==="sync"&&(tickN%5===0))softRenderSync()},1000);
  setInterval(saveCache,30000);
  S.wasToday=true;
  var db=null,user=null,sample=null,dl=null;
  try{if(window.claude&&window.claude.use){var r=await Promise.all([window.claude.use("db"),window.claude.use("user").catch(function(){return null}),window.claude.use("sample").catch(function(){return null}),window.claude.use("downloads").catch(function(){return null})]);db=r[0];user=r[1];sample=r[2];dl=r[3]}}catch(e){db=null}
  S.sample=sample;S.downloads=dl;S.user=user;
  if(!db){S.dbMissing=true;render();return}
  S.db=db;updatePill();
  db.doc("programme/current").onSnapshot(function(snap){
    var fromCache=snap.metadata&&snap.metadata.fromCache;
    if(!snap.exists){if(!fromCache){S.progMissing=!S.programme;S.progConfirmed=true;render()}return}
    var data=snap.data(),changed=JSON.stringify(data)!==JSON.stringify(S.programme);
    S.programme=clone(data);if(!fromCache){S.progConfirmed=true;S.progStale=false}
    buildIndex();saveCache();
    if(!S.oldChecked){S.oldChecked=true;S.recovered=findOldDrafts()}
    if(changed)render();
  },function(){if(S.programme)S.progStale=true;render()});
  db.doc("state/current").onSnapshot(function(snap){S.state=snap.exists?clone(snap.data()):{};SYNC.known["state/current"]=snap.exists?1:0;softRender()},function(){});
  db.doc("roadmap/current").onSnapshot(function(snap){S.roadmap=snap.exists?clone(snap.data()):null;if(S.tab==="goals")softRender()},function(){});
  db.collection("docs").onSnapshot(function(snap){S.docs=snap.docs.map(function(d){return {id:d.id,data:d.data()}}).sort(function(a,b){return (a.data.order||99)-(b.data.order||99)||String(b.data.updatedAt).localeCompare(String(a.data.updatedAt))});if(S.tab==="goals")softRender()},function(){});
  db.collection("customExercises").onSnapshot(function(snap){snap.docs.forEach(function(d){S.custom[d.id]=d.data()});if(S.programme)buildIndex()},function(){});
  subscribeDay(S.date);
  setTimeout(function(){if(S.dayLoaded&&!S.dayLoaded[S.date]){S.dayTimedOut=true;softRender()}},10000);
  try{var rows=await dbQuery("days",[["date",">=",addDays(todayStr(),-40)]]);rows.forEach(function(r){if(r.id!==S.date||!S.remote[r.id])S.recent[r.id]=r.data});S.recentLoaded=true;softRender()}catch(e){}
  kick();
}
function softRenderSync(){if(!focusedInput())render()}
function saveCache(){lsSet("bp-cache-v2",{programme:S.programme,state:S.state,roadmap:S.roadmap,custom:S.custom,remote:(function(){var o={};o[S.date]=S.remote[S.date];return o})()})}
window.__goSync=function(){if(S.offline)go('send');else go('library','sync')};
/* Read-only hook for tests/smoke.js. */
window.__BP_TEST={timing:function(){return sessionTiming(D())},dock:function(){var st=dockState(D());return {mode:st.mode,cur:st.cur&&st.cur.id,unit:st.unit&&{side:st.unit.side,n:st.unit.n,extra:st.unit.extra},strip:st.strip.map(function(x){return x.id})}}};
boot();

})();
</script>
